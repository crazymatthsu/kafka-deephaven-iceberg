# Standalone MinIO + bucket-init compose. Useful for running just MinIO without DH.
# The umbrella deephaven-server/compose/docker-compose.yml duplicates these definitions
# so that bringing up the deephaven stack alone also brings up MinIO; this file is
# retained for the case where someone wants only MinIO running.
services:
  minio:
    image: minio/minio:latest
    container_name: oms-minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT_S3:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adminadmin}
    volumes:
      - ../../data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oms-net

  minio-mc-init:
    image: minio/mc:latest
    container_name: oms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-iceberg-warehouse}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adminadmin}
    restart: "no"
    networks:
      - oms-net

networks:
  oms-net:
    name: ${COMPOSE_NETWORK:-oms-net}
    external: true
