syntax = "proto3";

package com.oms;

option java_package = "com.oms";
option java_multiple_files = true;

import "com/oms/common.proto";

// FIX 4.2 OrderCancelReplaceRequest (35=G)
message OrderCancelReplaceRequest {
  Header header = 1;
  string orig_cl_ord_id = 2;      // FIX tag 41 — points at chain's latest ClOrdID
  Side side = 3;                  // FIX tag 54
  OrdType ord_type = 4;           // FIX tag 40
  TimeInForce time_in_force = 5;  // FIX tag 59
  double order_qty = 6;           // FIX tag 38 (new qty)
  double price = 7;               // FIX tag 44 (new price; LIMIT only)
  bool has_price = 8;
}
