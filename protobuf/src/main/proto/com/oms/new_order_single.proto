syntax = "proto3";

package com.oms;

option java_package = "com.oms";
option java_multiple_files = true;

import "com/oms/common.proto";

// FIX 4.2 NewOrderSingle (35=D)
message NewOrderSingle {
  Header header = 1;
  Side side = 2;                  // FIX tag 54
  OrdType ord_type = 3;           // FIX tag 40
  TimeInForce time_in_force = 4;  // FIX tag 59
  double order_qty = 5;           // FIX tag 38
  double price = 6;               // FIX tag 44 (only for LIMIT)
  bool has_price = 7;             // explicit presence flag
}
